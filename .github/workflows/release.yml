name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true

jobs:
  release:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set release version
        run: echo "version=${{ github.event.inputs.version }}" > gradle.properties
        
      - name: Build with Gradle
        run: ./gradlew build

      - name: Rename JAR for release
        run: cp build/libs/jdkdb-scraper-${{ github.event.inputs.version }}-standalone.jar build/libs/jdkdb-scraper-standalone.jar

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "ci: Releasing version ${{ github.event.inputs.version }}"

      - name: Create Git tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release version ${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Publish release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          files: build/libs/jdkdb-scraper-standalone.jar
          draft: true
          prerelease: false
          generate_release_notes: true

      - name: Set development version
        run: echo "version=${{ github.event.inputs.version }}.1-SNAPSHOT" > gradle.properties

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "ci: Prepare for next development iteration"