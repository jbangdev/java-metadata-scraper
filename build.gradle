
plugins {
	id 'java'
	id 'application'
	id 'com.diffplug.spotless' version '8.2.1'
}

group "dev.jbang.jdkdb"

repositories {
	mavenCentral()
}

dependencies {
	// Jackson JSON processing
	implementation "com.fasterxml.jackson.core:jackson-databind:2.16.1"
	implementation "com.fasterxml.jackson.core:jackson-annotations:2.16.1"

	// Logging API used by distro implementations
	implementation "org.slf4j:slf4j-api:2.0.7"
	implementation "ch.qos.logback:logback-classic:1.4.14"

	// Command Line Parsing
	implementation "info.picocli:picocli:4.7.5"

	// Archive handling (for extracting release files from JDK archives)
	implementation "org.apache.commons:commons-compress:1.27.1"
	implementation "org.tukaani:xz:1.10"

	// Testing
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.assertj:assertj-core:3.27.6"
}

application {
	mainClass = 'dev.jbang.jdkdb.MainCommand'
}

java {
	sourceCompatibility = JavaVersion.toVersion('21')
	targetCompatibility = JavaVersion.toVersion('21')
}

tasks.register('generateVersionProperties') {
	def outputDir = file("$buildDir/generated-resources")
	outputs.dir outputDir
	doLast {
		def versionFile = file("$outputDir/version.properties")
		versionFile.parentFile.mkdirs()
		versionFile.text = "version=${project.version}\n"
	}
}

processResources {
	dependsOn generateVersionProperties
	from("$buildDir/generated-resources")
}

test {
	useJUnitPlatform()
}

tasks.register('standaloneJar', Jar) {
	archiveClassifier = 'standalone'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	manifest {
		attributes 'Main-Class': application.mainClass.get()
	}

	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}

	with jar
}

build.dependsOn standaloneJar

spotless {
	lineEndings 'UNIX'
	java {
		// Use Palantir Java Format (alternative to Google Java Format)
		palantirJavaFormat()

		// Remove unused imports
		removeUnusedImports()

		// Format other Java elements
		formatAnnotations()

		// Convert 4 leading spaces to tabs
		leadingSpacesToTabs(4)

		// Target all Java source files
		target 'src/**/*.java'

		// Toggle off/on formatting for specific code blocks
		toggleOffOn()
	}

	format 'misc', {
		// Define the target files for miscellaneous formatting
		target '*.gradle', '*.md', '.gitignore'
		targetExclude 'build/**/*', 'out/**/*'

		// Trim trailing whitespace
		trimTrailingWhitespace()

		// Convert 4 leading spaces to tabs
		leadingSpacesToTabs(4)

		// Ensure files end with a newline
		endWithNewline()
	}
}
